<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRASPADAJO APP - Ruang Anggota</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
    <script>
        (function checkAuth() {
            try {
                const sessionRaw = localStorage.getItem('userSession') || sessionStorage.getItem('userSession');
                if (!sessionRaw) { window.location.href = 'index.html'; return; }
                const session = JSON.parse(sessionRaw);
                if (!session || (session.role !== 'Anggota' && session.role !== 'Pengurus')) window.location.href = 'index.html';
            } catch (e) { window.location.href = 'index.html'; }
        })();
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 antialiased flex flex-col">

    <div class="w-full max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col overflow-hidden relative">
        
        <!-- HEADER -->
        <header class="bg-gradient-to-r from-blue-700 via-blue-600 to-blue-500 text-white px-5 pt-8 pb-6 relative overflow-hidden flex-none rounded-b-3xl shadow-md z-10">
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
            <div class="relative z-10 flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-white/15 backdrop-blur-md rounded-xl flex items-center justify-center border border-white/20 shadow-sm flex-none">
                        <i class="fa-solid fa-user-astronaut text-white text-xl"></i>
                    </div>
                    <div>
                        <span class="bg-blue-800/60 text-blue-100 text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider inline-block mb-0.5 border border-white/10">Ruang Anggota</span>
                        <h1 class="text-base font-extrabold tracking-tight truncate w-40" id="headerNameDisplay">Siswa</h1>
                    </div>
                </div>
                <button onclick="handleLogout()" class="bg-rose-500/80 hover:bg-rose-600 text-white p-2 rounded-xl border border-rose-300/30 shadow-md active:scale-95"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </header>

        <!-- TABS NAV (BOTTOM FIXED) -->
        <nav class="bg-white border-t border-gray-100 flex justify-around shadow-[0_-4px_10px_rgba(0,0,0,0.03)] fixed bottom-0 w-full max-w-md z-20 pb-safe">
            <button onclick="switchTab('tugas')" id="tabBtnTugas" class="flex-1 py-3.5 flex flex-col items-center gap-1 text-blue-600 font-bold border-t-2 border-blue-600 transition-colors">
                <i class="fa-solid fa-clipboard-list text-lg"></i><span class="text-[10px]">Tugas Aktif</span>
            </button>
            <button onclick="switchTab('riwayat')" id="tabBtnRiwayat" class="flex-1 py-3.5 flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 border-t-2 border-transparent transition-colors">
                <i class="fa-solid fa-clock-rotate-left text-lg"></i><span class="text-[10px]">Riwayat Tugas</span>
            </button>
        </nav>

        <main class="flex-grow p-4 bg-gray-50 flex flex-col overflow-y-auto custom-scroll pb-24">
            
            <!-- TAB: TUGAS AKTIF -->
            <section id="viewTugas" class="tab-view flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-gray-800 text-sm">Daftar Tugas Hari Ini</h2>
                    <button onclick="loadTasks(true)" class="text-blue-600 bg-blue-50 px-2 py-1 rounded-lg text-xs font-bold active:scale-95"><i class="fa-solid fa-rotate mr-1"></i>Refresh</button>
                </div>
                <div id="taskListContainer" class="flex flex-col gap-4">
                    <!-- Cards Tugas Akan Muncul di Sini -->
                </div>
            </section>

            <!-- TAB: RIWAYAT TUGAS -->
            <section id="viewRiwayat" class="tab-view hidden flex-col gap-4">
                <h2 class="font-bold text-gray-800 text-sm">Riwayat & Nilai Tugas</h2>
                <div id="riwayatListContainer" class="flex flex-col gap-3">
                    <!-- List Riwayat Muncul di Sini -->
                </div>
            </section>

        </main>
    </div>

    <!-- MODAL KAMERA -->
    <div id="cameraModal" class="fixed inset-0 bg-black z-50 flex flex-col hidden">
        <div class="p-4 flex justify-between items-center text-white z-10 bg-gradient-to-b from-black/80 to-transparent absolute top-0 w-full">
            <div>
                <h3 id="camSubTaskName" class="font-bold text-sm">Merekam...</h3>
                <p id="camDurasiTarget" class="text-[10px] text-gray-300">Target: 1 - 3 Menit</p>
            </div>
            <button onclick="closeCamera()" class="w-8 h-8 bg-gray-800/80 rounded-full flex items-center justify-center active:scale-95"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="flex-grow relative bg-black flex items-center justify-center overflow-hidden">
            <video id="videoPreview" autoplay playsinline muted class="w-full h-full object-cover"></video>
            
            <!-- Overlay Info (Timer & Progress) -->
            <div class="absolute bottom-24 w-full px-6 flex flex-col items-center gap-3">
                <div id="recordingTimer" class="text-white text-4xl font-mono font-bold drop-shadow-md hidden">00:00</div>
                <div id="progressContainer" class="w-full bg-gray-800/80 rounded-full h-2 overflow-hidden hidden">
                    <div id="progressBar" class="bg-rose-500 h-full transition-all duration-1000 ease-linear w-0"></div>
                </div>
                <p id="progressWarning" class="text-rose-400 text-xs font-bold drop-shadow-md hidden animate-pulse">Durasi belum mencapai target minimal!</p>
            </div>
        </div>

        <div class="p-6 bg-black flex justify-center items-center gap-6 pb-safe relative">
            <button id="btnSwitchCam" onclick="switchCamera()" class="w-12 h-12 bg-gray-800 text-white rounded-full flex items-center justify-center active:scale-95"><i class="fa-solid fa-rotate text-lg"></i></button>
            <button id="btnRecord" onclick="toggleRecording()" class="w-20 h-20 bg-rose-600 rounded-full flex items-center justify-center border-4 border-rose-300/30 active:scale-95 transition-all"><i id="recordIcon" class="fa-solid fa-video text-2xl text-white"></i></button>
            <div class="w-12 h-12"></div> <!-- Spacer for balance -->
        </div>
    </div>

    <!-- LOADING & TOAST -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-[100] flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity">
        <i class="fa-solid fa-circle-notch animate-spin text-4xl text-blue-600 mb-3"></i>
        <p id="loadingText" class="text-blue-700 font-bold text-sm animate-pulse text-center px-6">Menyiapkan Data...</p>
    </div>
    <div id="toastContainer" class="fixed top-5 left-1/2 -translate-x-1/2 z-[110] flex flex-col gap-2 pointer-events-none w-full max-w-xs px-4"></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwYTFRirtCpDT1vXJ0hSeFtElQR44rdoMPKskHgRPO3OlCr5_D_cXvLQOFzkDt4lY_IYw/exec';
        let state = { user: null, tasks: [], userSubs: {}, submissions: [] }; // submissions dari riwayat
        
        let currentRecordSession = {
            taskId: '', folderId: '', subName: '', minSec: 0, maxSec: 0, 
            stream: null, mediaRecorder: null, chunks: [],
            timerInterval: null, elapsedSec: 0, isRecording: false, facingMode: 'user'
        };

        document.addEventListener('DOMContentLoaded', () => {
            const raw = localStorage.getItem('userSession') || sessionStorage.getItem('userSession');
            if (raw) { state.user = JSON.parse(raw); document.getElementById('headerNameDisplay').textContent = state.user.nama; }
            loadTasks();
            loadRiwayat();
        });

        function handleLogout() { localStorage.removeItem('userSession'); sessionStorage.removeItem('userSession'); window.location.href = 'index.html'; }

        function switchTab(tabKey) {
            const tabs = ['tugas', 'riwayat'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tabBtn${t.charAt(0).toUpperCase() + t.slice(1)}`);
                const view = document.getElementById(`view${t.charAt(0).toUpperCase() + t.slice(1)}`);
                if (t === tabKey) {
                    btn.classList.add('text-blue-600', 'border-blue-600'); btn.classList.remove('text-gray-400', 'border-transparent');
                    view.classList.remove('hidden'); view.classList.add('flex');
                } else {
                    btn.classList.remove('text-blue-600', 'border-blue-600'); btn.classList.add('text-gray-400', 'border-transparent');
                    view.classList.add('hidden'); view.classList.remove('flex');
                }
            });
        }

        // --- FETCH TUGAS AKTIF ---
        function getTodayString() {
            const d = new Date();
            return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
        }

        function loadTasks(isManual = false) {
            showLoading(true, "Memuat Daftar Tugas...");
            fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getTasks', username: state.user.username }) })
            .then(r=>r.json()).then(d => {
                showLoading(false);
                if (d.success) {
                    state.tasks = d.tasks; state.userSubs = d.userSubs;
                    renderTasks();
                    if(isManual) showToast("Data diperbarui", "success");
                } else showToast("Gagal memuat tugas", "error");
            }).catch(e => { showLoading(false); showToast("Koneksi Error", "error"); });
        }

        function renderTasks() {
            const container = document.getElementById('taskListContainer');
            let html = '';
            const todayStr = getTodayString();
            let activeTaskCount = 0;

            state.tasks.forEach(task => {
                let isActiveToday = false;
                const isSatuKali = task.tipePengumpulan === 'Satu Kali';

                // Logika Filter Tanggal
                if (isSatuKali) {
                    const dates = task.tanggalPengerjaan.split(' to ');
                    const start = dates[0];
                    const end = dates.length > 1 ? dates[1] : dates[0];
                    if (todayStr >= start && todayStr <= end) isActiveToday = true;
                } else {
                    const dates = task.tanggalPengerjaan.split(', ');
                    if (dates.includes(todayStr)) isActiveToday = true;
                }

                if(isActiveToday) {
                    let subTaskHtml = '';
                    let allSubTasksDone = true;

                    // Logika Sub Tugas JSON (Array)
                    task.subTugas.forEach(sub => {
                        let isDone = false;
                        if(isSatuKali) {
                            // Jika Satu Kali, cek apakah di userSubs ada key yang mengandung sub.nama untuk taskId ini (di tanggal berapapun)
                            isDone = Object.keys(state.userSubs).some(k => k.startsWith(task.taskId + "_") && k.endsWith("_" + sub.nama));
                        } else {
                            // Jika Harian, cek apakah hari ini sudah kumpul sub.nama ini
                            const key = task.taskId + "_" + todayStr + "_" + sub.nama;
                            isDone = !!state.userSubs[key];
                        }

                        if(!isDone) {
                            allSubTasksDone = false;
                            subTaskHtml += `
                                <button onclick="openCameraSetup('${task.taskId}', '${task.folderId}', '${sub.nama}', ${sub.min}, ${sub.max})" class="w-full mt-2 bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-3 px-4 rounded-xl text-xs flex justify-between items-center transition-all active:scale-95 border border-blue-200">
                                    <span class="flex items-center gap-2"><i class="fa-solid fa-video text-blue-600"></i> Rekam: ${sub.nama}</span>
                                    <span class="text-[9px] bg-white px-2 py-1 rounded-lg text-blue-600 shadow-sm">${sub.min}-${sub.max} mnt</span>
                                </button>
                            `;
                        } else {
                            subTaskHtml += `
                                <div class="w-full mt-2 bg-emerald-50 text-emerald-700 font-bold py-3 px-4 rounded-xl text-xs flex justify-between items-center border border-emerald-100 opacity-80">
                                    <span class="flex items-center gap-2"><i class="fa-solid fa-circle-check"></i> ${sub.nama}</span>
                                    <span class="text-[9px] bg-emerald-100 px-2 py-1 rounded-lg">Selesai</span>
                                </div>
                            `;
                        }
                    });

                    // Hanya tampilkan jika belum semua selesai (khusus "Satu Kali", card hilang. Jika Harian, card tampil sebagai riwayat kecil hari ini)
                    if(!allSubTasksDone || !isSatuKali) {
                        activeTaskCount++;
                        html += `
                            <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <span class="text-[9px] font-bold text-white px-2 py-0.5 rounded-full mb-1 inline-block ${isSatuKali ? 'bg-amber-500' : 'bg-purple-500'}">${task.tipePengumpulan}</span>
                                        <h3 class="font-extrabold text-gray-800 text-base leading-tight">${task.judulTugas}</h3>
                                    </div>
                                </div>
                                <p class="text-xs text-gray-500 mb-3 bg-gray-50 p-2 rounded-lg border border-gray-100">${task.instruksi}</p>
                                <div class="flex flex-col gap-1 border-t border-gray-100 pt-3">
                                    <p class="text-[10px] font-bold text-gray-400 uppercase">Aksi Perekaman:</p>
                                    ${subTaskHtml}
                                </div>
                            </div>
                        `;
                    }
                }
            });

            if (activeTaskCount === 0) {
                html = `
                    <div class="flex flex-col items-center justify-center py-10 opacity-60">
                        <i class="fa-solid fa-champagne-glasses text-4xl text-gray-300 mb-3"></i>
                        <p class="text-sm font-bold text-gray-500 text-center">Hore!<br>Tidak ada tugas aktif untuk Anda hari ini.</p>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // --- FETCH RIWAYAT ---
        function loadRiwayat() {
            // Karena kita butuh nilai (A-E), kita ambil getDashboardData untuk memfilter nama kita
            fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getDashboardData' }) })
            .then(r=>r.json()).then(d => {
                if (d.success) {
                    state.submissions = d.submissions.filter(s => s.namaAnggota === state.user.nama).reverse();
                    renderRiwayat();
                }
            }).catch(e => console.log(e));
        }

        function renderRiwayat() {
            const container = document.getElementById('riwayatListContainer');
            if(state.submissions.length === 0) {
                container.innerHTML = `<p class="text-xs text-center text-gray-400 py-10">Belum ada riwayat tugas.</p>`;
                return;
            }

            container.innerHTML = state.submissions.map(s => {
                const n = s.nilai;
                const badgeColor = (n==='A')?'bg-emerald-500':(n==='B')?'bg-blue-500':(n==='C')?'bg-amber-500':(n==='D')?'bg-orange-500':(n==='E')?'bg-rose-500':'bg-gray-300';
                return `
                <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm flex justify-between items-center">
                    <div class="flex flex-col overflow-hidden pr-2">
                        <span class="text-[10px] text-gray-400 font-semibold">${s.tanggal}</span>
                        <h4 class="font-bold text-gray-800 text-xs truncate">${s.subTugasName}</h4>
                    </div>
                    <div class="flex flex-col items-center">
                        <span class="text-[8px] font-bold text-gray-400 uppercase mb-0.5">Nilai</span>
                        <span class="w-8 h-8 rounded-full ${badgeColor} text-white font-extrabold flex items-center justify-center text-sm shadow-sm">${n && n !== '-' ? n : '?'}</span>
                    </div>
                </div>`;
            }).join('');
        }


        // --- LOGIKA KAMERA & VIDEO ---
        function openCameraSetup(taskId, folderId, subName, minMnt, maxMnt) {
            currentRecordSession = {
                taskId: taskId, folderId: folderId, subName: subName,
                minSec: minMnt * 60, maxSec: maxMnt * 60,
                stream: null, mediaRecorder: null, chunks: [],
                timerInterval: null, elapsedSec: 0, isRecording: false, facingMode: 'user'
            };
            
            document.getElementById('camSubTaskName').textContent = subName;
            document.getElementById('camDurasiTarget').textContent = `Target: ${minMnt} - ${maxMnt} Menit`;
            document.getElementById('cameraModal').classList.remove('hidden');
            
            initCamera();
        }

        async function initCamera() {
            try {
                if(currentRecordSession.stream) currentRecordSession.stream.getTracks().forEach(t => t.stop());
                
                // Menurunkan resolusi agar Base64 tidak terlalu raksasa saat dikirim
                const constraints = { 
                    video: { facingMode: currentRecordSession.facingMode, width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: true 
                };
                currentRecordSession.stream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('videoPreview').srcObject = currentRecordSession.stream;
            } catch (err) {
                showToast("Akses kamera ditolak / tidak tersedia.", "error");
                closeCamera();
            }
        }

        function switchCamera() {
            if (currentRecordSession.isRecording) return;
            currentRecordSession.facingMode = currentRecordSession.facingMode === 'user' ? 'environment' : 'user';
            initCamera();
        }

        function closeCamera() {
            if (currentRecordSession.isRecording) stopRecording(false);
            if (currentRecordSession.stream) currentRecordSession.stream.getTracks().forEach(t => t.stop());
            clearInterval(currentRecordSession.timerInterval);
            document.getElementById('cameraModal').classList.add('hidden');
            resetCameraUI();
        }

        function toggleRecording() {
            if (!currentRecordSession.isRecording) startRecording();
            else stopRecording(true);
        }

        function startRecording() {
            currentRecordSession.chunks = [];
            // Kompresi Bitrate agar file ringan (500kbps)
            let options = { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 500000 };
            try {
                currentRecordSession.mediaRecorder = new MediaRecorder(currentRecordSession.stream, options);
            } catch(e) {
                // Fallback untuk Safari / iOS
                currentRecordSession.mediaRecorder = new MediaRecorder(currentRecordSession.stream);
            }

            currentRecordSession.mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) currentRecordSession.chunks.push(e.data); };
            currentRecordSession.mediaRecorder.onstop = () => { processVideoUpload(); };
            
            currentRecordSession.mediaRecorder.start(1000); // chunk tiap 1 detik
            currentRecordSession.isRecording = true;
            currentRecordSession.elapsedSec = 0;
            
            // UI Updates
            document.getElementById('btnSwitchCam').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('btnRecord').classList.replace('bg-rose-600', 'bg-white');
            document.getElementById('recordIcon').classList.replace('fa-video', 'fa-stop');
            document.getElementById('recordIcon').classList.replace('text-white', 'text-rose-600');
            document.getElementById('recordingTimer').classList.remove('hidden');
            document.getElementById('progressContainer').classList.remove('hidden');
            
            currentRecordSession.timerInterval = setInterval(updateTimerAndProgress, 1000);
        }

        function updateTimerAndProgress() {
            currentRecordSession.elapsedSec++;
            const s = currentRecordSession.elapsedSec;
            
            // Text Timer
            const mText = String(Math.floor(s / 60)).padStart(2, '0');
            const sText = String(s % 60).padStart(2, '0');
            document.getElementById('recordingTimer').textContent = `${mText}:${sText}`;
            
            // Progress Bar Logic
            const pb = document.getElementById('progressBar');
            const pct = Math.min((s / currentRecordSession.maxSec) * 100, 100);
            pb.style.width = pct + "%";
            
            if (s < currentRecordSession.minSec) {
                pb.classList.replace('bg-emerald-500', 'bg-rose-500'); // Merah (Belum Cukup)
                document.getElementById('progressWarning').classList.remove('hidden');
            } else {
                pb.classList.replace('bg-rose-500', 'bg-emerald-500'); // Hijau (Aman)
                document.getElementById('progressWarning').classList.add('hidden');
            }
            
            // Auto Stop di Max
            if (s >= currentRecordSession.maxSec) {
                stopRecording(true);
            }
        }

        function stopRecording(save) {
            clearInterval(currentRecordSession.timerInterval);
            currentRecordSession.isRecording = false;
            if(currentRecordSession.mediaRecorder && currentRecordSession.mediaRecorder.state !== 'inactive') {
                currentRecordSession.mediaRecorder.stop();
            }
            if(!save) currentRecordSession.chunks = []; // cancel
        }

        function resetCameraUI() {
            document.getElementById('btnSwitchCam').classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('btnRecord').classList.replace('bg-white', 'bg-rose-600');
            document.getElementById('recordIcon').classList.replace('fa-stop', 'fa-video');
            document.getElementById('recordIcon').classList.replace('text-rose-600', 'text-white');
            document.getElementById('recordingTimer').classList.add('hidden');
            document.getElementById('progressContainer').classList.add('hidden');
            document.getElementById('progressWarning').classList.add('hidden');
            document.getElementById('progressBar').style.width = "0%";
            document.getElementById('recordingTimer').textContent = "00:00";
        }

        function processVideoUpload() {
            if (currentRecordSession.chunks.length === 0) return;
            if (currentRecordSession.elapsedSec < currentRecordSession.minSec) {
                showToast(`Video dibatalkan. Minimal harus ${currentRecordSession.minSec / 60} Menit!`, "error");
                currentRecordSession.chunks = [];
                resetCameraUI();
                return;
            }

            const blob = new Blob(currentRecordSession.chunks, { type: currentRecordSession.chunks[0].type });
            const reader = new FileReader();
            
            showLoading(true, "Mengompres & Mengirim Video...\n(Mohon Tunggu)");
            closeCamera();
            
            reader.onloadend = function() {
                const base64data = reader.result;
                const payload = {
                    action: 'submitVideoBase64',
                    subId: 'SUB_' + Date.now(),
                    taskId: currentRecordSession.taskId,
                    taskFolderId: currentRecordSession.folderId,
                    namaAnggota: state.user.nama,
                    tanggal: getTodayString(), // Tanggal kirim
                    subTugasName: currentRecordSession.subName,
                    filename: `${state.user.nama}_${currentRecordSession.subName}_${Date.now()}.webm`,
                    mimeType: blob.type || 'video/webm',
                    base64Data: base64data
                };
                
                fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) })
                .then(r=>r.json()).then(d => {
                    showLoading(false);
                    if (d.success) {
                        showToast(d.message, "success");
                        loadTasks(); // Refresh List (menghilangkan tombol yang sudah selesai)
                        loadRiwayat(); // Refresh Riwayat
                    } else showToast(d.message, "error");
                }).catch(e => { showLoading(false); showToast("Gagal mengirim video (Koneksi putus/File terlalu besar)", "error"); });
            };
            
            reader.readAsDataURL(blob);
        }

        // --- UTILS ---
        function showLoading(show, txt="Memproses...") { document.getElementById('loadingText').innerText = txt; document.getElementById('loadingOverlay').classList[show?'remove':'add']('opacity-0', 'pointer-events-none'); }
        function showToast(msg, type='info') {
            const div = document.createElement('div'); div.className = `p-3 rounded-xl shadow-xl text-xs font-bold text-white flex items-center gap-2 transition-all transform translate-y-4 opacity-0 mt-2 ${type==='success'?'bg-emerald-600':type==='error'?'bg-rose-600':'bg-gray-800'}`;
            div.innerHTML = `<i class="fa-solid ${type==='success'?'fa-check':type==='error'?'fa-xmark':'fa-info'}"></i> <span>${msg}</span>`;
            document.getElementById('toastContainer').appendChild(div); setTimeout(() => div.classList.remove('translate-y-4', 'opacity-0'), 50); setTimeout(() => { div.classList.add('opacity-0'); setTimeout(()=>div.remove(), 300); }, 3000);
        }
    </script>
</body>
</html>
