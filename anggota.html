<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRASPADAJO APP - Ruang Anggota</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
    <script>
        (function checkAuth() {
            try {
                const sessionRaw = localStorage.getItem('userSession') || sessionStorage.getItem('userSession');
                if (!sessionRaw) { window.location.href = 'index.html'; return; }
                const session = JSON.parse(sessionRaw);
                if (!session || session.role !== 'Anggota') window.location.href = 'index.html';
            } catch (e) { window.location.href = 'index.html'; }
        })();
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.3); opacity: 0; } }
        .recording-pulse::before { content: ''; position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 50%; border: 3px solid #ef4444; animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; } .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 antialiased flex flex-col items-center">

    <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[850px] sm:my-6 sm:rounded-[2.5rem] sm:shadow-2xl flex flex-col relative overflow-hidden">
        
        <!-- HEADER -->
        <header id="appHeader" class="bg-gradient-to-r from-blue-700 via-blue-600 to-blue-500 text-white px-5 pt-8 pb-10 relative overflow-hidden flex-none">
            <div class="absolute -top-12 -right-12 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
            <div class="absolute bottom-0 left-1/3 w-28 h-28 bg-blue-300/20 rounded-full blur-xl"></div>
            <div class="relative z-10 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-white/15 backdrop-blur-md rounded-2xl p-2 flex items-center justify-center border border-white/20 shadow-md">
                        <img src="./logo.png" alt="Logo" class="max-h-full max-w-full object-contain" onerror="this.outerHTML='<i class=\'fa-solid fa-shield-halved text-white text-xl\'></i>';">
                    </div>
                    <div>
                        <span id="roleBadge" class="bg-blue-800/60 text-blue-100 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider block mb-0.5 border border-white/10 w-max">Anggota Aktif</span>
                        <h1 class="text-base font-extrabold tracking-tight leading-tight">PRASPADAJO</h1>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="openPasswordModal()" class="bg-blue-500 hover:bg-blue-600 text-white p-2.5 rounded-xl shadow-md active:scale-95"><i class="fa-solid fa-key text-sm"></i></button>
                    <button onclick="handleLogout()" class="bg-rose-500 hover:bg-rose-600 text-white p-2.5 rounded-xl shadow-md active:scale-95"><i class="fa-solid fa-right-from-bracket text-sm"></i></button>
                </div>
            </div>
            <div class="mt-6 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-4 relative z-10 shadow-inner">
                <p class="text-[11px] text-blue-100 font-medium uppercase tracking-wider mb-0.5">Selamat Datang,</p>
                <h2 id="userNameDisplay" class="text-lg font-bold text-white leading-tight truncate">Nama Siswa</h2>
                <div class="mt-2 flex items-center gap-1.5 text-xs text-blue-50">
                    <i class="fa-solid fa-users-rectangle text-[10px]"></i><span id="userClassDisplay">Kelas</span>
                </div>
            </div>
        </header>

        <!-- DYNAMIC NAVIGATION -->
        <nav class="bg-white border-b border-gray-100 flex shadow-sm z-20 sticky top-0 overflow-x-auto custom-scroll">
            <button onclick="switchTab('dashboard')" id="tabBtnDashboard" class="flex-1 min-w-[90px] py-3 text-xs font-bold text-blue-600 border-b-2 border-blue-600 flex justify-center items-center gap-1.5"><i class="fa-solid fa-list-check"></i> Tugas</button>
            <button onclick="switchTab('riwayatTugas')" id="tabBtnRiwayatTugas" class="flex-1 min-w-[100px] py-3 text-xs font-bold text-gray-400 border-b-2 border-transparent flex justify-center items-center gap-1.5"><i class="fa-solid fa-medal"></i> Riwayat Tugas</button>
            <button onclick="switchTab('riwayatLatihan')" id="tabBtnRiwayatLatihan" class="flex-1
