<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Pengumpulan Tugas</title>
    
    <!-- Favicon -->
    <link rel="icon" href="logo.png" type="image/png">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Konfigurasi Custom Font Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Mencegah highlight biru saat elemen disentuh di HP */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Animasi kustom untuk notifikasi */
        .toast-enter {
            transform: translate(-50%, 1rem);
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen sm:p-6">

    <!-- Container Utama (Ukuran HP, terpusat di Desktop) -->
    <div class="w-full max-w-md bg-white relative overflow-hidden min-h-screen sm:min-h-[800px] sm:rounded-[2.5rem] sm:shadow-2xl flex flex-col">
        
        <!-- ==================== HEADER (GRADASI BIRU) ==================== -->
        <div class="bg-gradient-to-b from-blue-700 to-blue-400 pt-16 pb-24 px-6 flex flex-col items-center justify-start flex-none relative">
            
            <!-- Ornamen Dekoratif (Opsional, agar tidak terlalu kosong) -->
            <div class="absolute top-0 right-0 -mr-16 -mt-16 w-48 h-48 bg-white opacity-10 rounded-full blur-2xl"></div>
            <div class="absolute bottom-10 left-10 w-24 h-24 bg-blue-300 opacity-20 rounded-full blur-xl"></div>

            <!-- Logo (Jika logo.png gagal dimuat, akan memunculkan placeholder biru) -->
            <img src="logo.png" alt="Logo Web App" class="h-20 w-auto object-contain z-10 drop-shadow-md" 
                 onerror="this.src='https://placehold.co/200x200/ffffff/1d4ed8?text=LOGO'">
        </div>

        <!-- ==================== FORM BOX PUTIH ==================== -->
        <div class="bg-white rounded-t-[2.5rem] flex-grow -mt-12 px-8 pt-10 pb-8 flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.1)] relative z-10">
            
            <!-- Judul -->
            <h1 class="text-2xl font-bold text-gray-800 text-center mb-1">Welcome Back</h1>
            <p class="text-gray-400 text-sm text-center mb-8 font-medium">Enter your details below</p>

            <!-- Toggle Role (Pelatih / Anggota) -->
            <div class="flex p-1 bg-gray-100 rounded-2xl mb-8 relative">
                <!-- Highlight Background Berjalan -->
                <div id="roleHighlight" class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-white rounded-xl shadow-sm transition-all duration-300 ease-out"></div>
                
                <button type="button" id="btnAnggota" class="flex-1 py-3 text-sm font-bold text-blue-600 relative z-10 transition-colors duration-300" onclick="setRole('Anggota')">
                    Login Anggota
                </button>
                <button type="button" id="btnPelatih" class="flex-1 py-3 text-sm font-semibold text-gray-400 relative z-10 transition-colors duration-300" onclick="setRole('Pelatih')">
                    Login Pelatih
                </button>
            </div>

            <!-- Form Input -->
            <form id="loginForm" class="flex flex-col gap-5">
                
                <!-- Input Nama/ID -->
                <div>
                    <label class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-2 block ml-1">Nama Lengkap / ID</label>
                    <input type="text" id="inputNama" required
                        placeholder="Contoh: Budi Santoso"
                        class="w-full px-5 py-4 bg-gray-50 text-gray-800 rounded-2xl border border-gray-200 focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 transition-all placeholder:text-gray-400">
                </div>

                <!-- Input Password -->
                <div>
                    <label class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-2 block ml-1">Password</label>
                    <div class="relative">
                        <input type="password" id="inputPassword" required
                            placeholder="Masukkan password Anda"
                            class="w-full pl-5 pr-12 py-4 bg-gray-50 text-gray-800 rounded-2xl border border-gray-200 focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 transition-all placeholder:text-gray-400">
                        
                        <!-- Ikon Mata (Show/Hide Password) -->
                        <button type="button" id="btnTogglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-500 focus:outline-none p-1">
                            <!-- SVG Eye Closed -->
                            <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                            </svg>
                            <!-- SVG Eye Open (Hidden by default) -->
                            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" class="mt-4 w-full bg-gradient-to-r from-blue-600 to-blue-400 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/30 transform transition-transform active:scale-95 hover:shadow-blue-500/50">
                    Sign in
                </button>
            </form>
        </div>
    </div>

    <!-- ==================== LOADING OVERLAY ==================== -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <!-- Lingkaran Loading Memutari Logo -->
        <div class="relative flex items-center justify-center w-28 h-28">
            <!-- Spinner Ring -->
            <svg class="animate-spin absolute inset-0 w-full h-full text-blue-600 drop-shadow-md" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle>
                <path class="opacity-100" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <!-- Logo di Tengah -->
            <img src="logo.png" alt="Loading Logo" class="w-12 h-12 object-contain absolute animate-pulse" 
                 onerror="this.src='https://placehold.co/100x100/ffffff/1d4ed8?text=L'">
        </div>
        <p class="mt-6 text-blue-700 font-bold tracking-wide animate-pulse">Menghubungkan...</p>
    </div>

    <!-- ==================== TOAST NOTIFICATION (PENGGANTI ALERT) ==================== -->
    <div id="toast" class="fixed top-0 left-1/2 -translate-x-1/2 mt-4 max-w-sm w-[90%] px-6 py-4 rounded-2xl shadow-xl transform -translate-y-20 opacity-0 transition-all duration-300 z-[60] flex items-center gap-3">
        <div id="toastIcon"></div>
        <p id="toastMessage" class="text-sm font-semibold text-white"></p>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // State Variabel
        let currentRole = 'Anggota';
        
        // Element HTML
        const btnAnggota = document.getElementById('btnAnggota');
        const btnPelatih = document.getElementById('btnPelatih');
        const roleHighlight = document.getElementById('roleHighlight');
        const form = document.getElementById('loginForm');
        const inputPassword = document.getElementById('inputPassword');
        const btnTogglePassword = document.getElementById('btnTogglePassword');
        const eyeOpen = document.getElementById('eyeOpen');
        const eyeClosed = document.getElementById('eyeClosed');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // Fungsi Toggle Role (Animasi Pill)
        function setRole(role) {
            currentRole = role;
            if (role === 'Anggota') {
                roleHighlight.style.transform = 'translateX(0)';
                btnAnggota.classList.remove('text-gray-400', 'font-semibold');
                btnAnggota.classList.add('text-blue-600', 'font-bold');
                
                btnPelatih.classList.remove('text-blue-600', 'font-bold');
                btnPelatih.classList.add('text-gray-400', 'font-semibold');
            } else {
                // Geser highlight ke kanan
                roleHighlight.style.transform = 'translateX(100%)';
                btnPelatih.classList.remove('text-gray-400', 'font-semibold');
                btnPelatih.classList.add('text-blue-600', 'font-bold');
                
                btnAnggota.classList.remove('text-blue-600', 'font-bold');
                btnAnggota.classList.add('text-gray-400', 'font-semibold');
            }
        }

        // Fungsi Toggle Visibilitas Password
        btnTogglePassword.addEventListener('click', () => {
            if (inputPassword.type === 'password') {
                inputPassword.type = 'text';
                eyeClosed.classList.add('hidden');
                eyeOpen.classList.remove('hidden');
            } else {
                inputPassword.type = 'password';
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
            }
        });

        // Fungsi Menampilkan Notifikasi (Custom Toast pengganti alert)
        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            // Reset kelas warna
            toast.className = 'fixed top-0 left-1/2 -translate-x-1/2 mt-4 max-w-sm w-[90%] px-6 py-4 rounded-2xl shadow-2xl transform -translate-y-20 opacity-0 transition-all duration-300 z-[60] flex items-center gap-3';
            
            if (type === 'error') {
                toast.classList.add('bg-red-500');
                toastIcon.innerHTML = `<svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
            } else {
                toast.classList.add('bg-emerald-500');
                toastIcon.innerHTML = `<svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
            }

            toastMsg.textContent = message;

            // Munculkan toast
            requestAnimationFrame(() => {
                toast.classList.remove('-translate-y-20', 'opacity-0');
                toast.classList.add('toast-enter');
            });

            // Hilangkan setelah 3 detik
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Fungsi Menangani Submit Form Login
        form.addEventListener('submit', (e) => {
            e.preventDefault(); // Mencegah reload halaman
            
            const nama = document.getElementById('inputNama').value;
            const password = inputPassword.value;

            // Memunculkan Layar Loading
            loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
            
            // ==========================================
            // KODE INTEGRASI GOOGLE APPS SCRIPT (GAS)
            // ==========================================
            /* 
            Ganti URL_WEB_APP_GAS_ANDA dengan URL Exec dari deployment script Anda.
            Contoh: const scriptURL = 'https://script.google.com/macros/s/AKfycb.../exec';
            */
            const scriptURL = 'URL_WEB_APP_GAS_ANDA'; 
            
            // --- HAPUS KOMENTAR BLOK fetch() DI BAWAH INI JIKA URL GAS SUDAH DIMASUKKAN ---
            
            /*
            fetch(scriptURL, {
                method: 'POST',
                // Mode 'no-cors' kadang diperlukan jika ada isu CORS, namun biasanya 
                // untuk menerima balasan JSON yang rapi, kita tidak pakai 'no-cors' dan 
                // pastikan GAS merespon textOutput dengan mimetype JSON.
                body: JSON.stringify({
                    action: 'login',
                    nama: nama,
                    password: password,
                    role: currentRole
                })
            })
            .then(response => response.json())
            .then(data => {
                loadingOverlay.classList.add('opacity-0', 'pointer-events-none'); // Tutup loading
                
                if(data.success) {
                    showToast("Login Berhasil! Mengalihkan...", "success");
                    
                    // Simpan sesi secara aman di memori lokal sementara (sessionStorage)
                    // bukan di localStorage agar hilang saat tab ditutup
                    sessionStorage.setItem('userSession', JSON.stringify(data.user));
                    
                    // Arahkan ke halaman Dashboard (contoh: dashboard.html)
                    setTimeout(() => {
                        // window.location.href = "dashboard.html";
                        console.log("Redirect ke dashboard...", data.user);
                    }, 1000);
                } else {
                    showToast(data.message, "error");
                }
            })
            .catch(error => {
                loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
                showToast("Gagal menghubungi server. Periksa koneksi Anda.", "error");
                console.error('Error:', error);
            });
            */
            
            // ==========================================
            // SIMULASI LOADING (UNTUK PREVIEW SEKARANG)
            // Hapus blok setTimeout di bawah ini jika fetch() di atas sudah diaktifkan.
            // ==========================================
            setTimeout(() => {
                loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
                
                // Simulasi Cek Validasi Kosong (Ini nanti digantikan oleh respon GAS)
                if (password.length < 4) {
                    showToast("Password minimal 4 karakter!", "error");
                } else {
                    showToast(`Login simulasi sukses sebagai ${currentRole}`, "success");
                }
            }, 2000);
        });
    </script>
</body>
</html>
