<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASKIBRA SMPN 2 JOGOROTO | Web App</title>

    <!-- Favicon -->
    <link rel="icon" href="logo.png" type="image/png">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Custom Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    },
                    animation: {
                        float: 'float 4s ease-in-out infinite',
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Smooth Toast Enter Animation */
        .toast-enter {
            transform: translate(-50%, 0.5rem) !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex items-center justify-center sm:py-6">

    <!-- Container Utama Aplikasi -->
    <div class="w-full max-w-md bg-white relative overflow-hidden min-h-screen sm:min-h-[750px] sm:rounded-[2.5rem] sm:shadow-2xl flex flex-col justify-between">
        
        <!-- Top Section: Header Biru Gradasi dengan Logo -->
        <div class="bg-gradient-to-b from-blue-700 via-blue-600 to-blue-500 pt-12 pb-24 px-6 flex flex-col items-center justify-start relative flex-none">
            <!-- Decorative Light Circles -->
            <div class="absolute top-0 right-0 -mr-16 -mt-16 w-48 h-48 bg-white opacity-10 rounded-full blur-2xl"></div>
            <div class="absolute bottom-6 left-6 w-24 h-24 bg-blue-300 opacity-20 rounded-full blur-xl"></div>

            <!-- REVISI 1: Logo Tanpa Border, Diperbesar, dan Animasi Float -->
            <div class="w-32 h-32 flex items-center justify-center z-10 mb-2 animate-float">
                <img src="./logo.png" id="appLogo" alt="Logo Paskibra SMPN 2 Jogoroto" class="max-h-full max-w-full object-contain drop-shadow-2xl" 
                     onerror="this.onerror=null; this.outerHTML='<i class=\'fa-solid fa-shield-halved text-white text-6xl drop-shadow-lg\'></i>';">
            </div>
            
            <!-- REVISI 2: Judul Web App -->
            <div class="z-10 text-center px-2">
                <p class="text-blue-100 text-[11px] font-semibold tracking-[0.4em] uppercase mb-1">WEB APP</p>
                <h2 class="text-white text-base sm:text-lg font-extrabold tracking-wide leading-snug">PASKIBRA SMPN 2 JOGOROTO</h2>
            </div>
        </div>

        <!-- Card Putih Melengkung (Form Login) -->
        <div class="bg-white rounded-t-[2.5rem] flex-grow -mt-12 px-8 pt-8 pb-10 flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.08)] relative z-10">
            
            <!-- REVISI 3: Sapaan Dinamis -->
            <h1 id="welcomeText" class="text-2xl font-bold text-gray-800 text-center mb-1">Memuat sapaan...</h1>
            
            <!-- REVISI 4: Kalimat Motivasi Acak -->
            <p id="motivationText" class="text-gray-400 text-xs text-center mb-6 font-medium">Menyiapkan motivasi...</p>

            <!-- Role Selector Toggle (Kiri: Pelatih | Kanan: Anggota) - DEFAULT: ANGGOTA -->
            <div class="flex p-1 bg-gray-100 rounded-2xl mb-6 relative">
                <div id="roleHighlight" class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-white rounded-xl shadow-sm transition-all duration-300 ease-out" style="transform: translateX(100%);"></div>
                
                <!-- Kiri: Pelatih -->
                <button type="button" id="btnPelatih" class="flex-1 py-3 text-sm font-semibold text-gray-400 relative z-10 transition-colors duration-300" onclick="setRole('Pelatih')">
                    Pelatih
                </button>
                <!-- Kanan: Anggota -->
                <button type="button" id="btnAnggota" class="flex-1 py-3 text-sm font-bold text-blue-600 relative z-10 transition-colors duration-300" onclick="setRole('Anggota')">
                    Anggota
                </button>
            </div>

            <!-- Alert Banner Pesan Error -->
            <div id="alertBanner" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 rounded-2xl text-rose-700 text-xs flex items-center gap-2.5">
                <i class="fa-solid fa-circle-exclamation text-rose-500 text-base flex-none"></i>
                <span id="alertMessage" class="font-medium"></span>
            </div>

            <!-- Form Login -->
            <form id="loginForm" class="flex flex-col gap-4">
                <div>
                    <label class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-1.5 block ml-1">Username</label>
                    <input type="text" id="username" required placeholder="Masukkan Username"
                        class="w-full px-4 py-3.5 bg-gray-50 text-gray-800 text-sm rounded-2xl border border-gray-200 focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 transition-all placeholder:text-gray-400">
                </div>

                <div>
                    <label class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-1.5 block ml-1">Password</label>
                    <div class="relative">
                        <input type="password" id="inputPassword" required placeholder="Masukkan Password"
                            class="w-full pl-4 pr-12 py-3.5 bg-gray-50 text-gray-800 text-sm rounded-2xl border border-gray-200 focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 transition-all placeholder:text-gray-400">
                        
                        <button type="button" id="btnTogglePassword" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-500 p-1">
                            <i id="eyeIcon" class="fa-solid fa-eye-slash text-base"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="mt-4 w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/30 transform transition-all active:scale-95 hover:shadow-blue-500/50 flex items-center justify-center gap-2">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>
        </div>

        <!-- REVISI 5: Loading Screen Disamakan dengan Halaman Lain -->
        <div id="loadingOverlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[100] flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity">
            <div class="w-24 h-24 mb-4 flex items-center justify-center">
                <img src="./logo.png" alt="Loading" class="max-h-full max-w-full object-contain animate-pulse drop-shadow-xl" onerror="this.outerHTML='<i class=\'fa-solid fa-shield-halved text-blue-600 text-5xl animate-pulse\'></i>';">
            </div>
            <p id="loadingText" class="text-blue-700 font-bold text-sm animate-pulse">Memverifikasi Akun...</p>
        </div>

    </div>

    <!-- Script Logika Frontend & GAS API -->
    <script>
        // Endpoint Google Apps Script
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwYTFRirtCpDT1vXJ0hSeFtElQR44rdoMPKskHgRPO3OlCr5_D_cXvLQOFzkDt4lY_IYw/exec';

        // DEFAULT ROLE: ANGGOTA
        let currentRole = 'Anggota';

        // REVISI 3 & 4: Logika Sapaan dan 30 Variasi Motivasi
        document.addEventListener('DOMContentLoaded', () => {
            // Set Sapaan (Selamat Pagi/Siang/Sore/Malam)
            const hour = new Date().getHours();
            let greeting = "Selamat Malam!";
            if (hour >= 4 && hour < 11) greeting = "Selamat Pagi!";
            else if (hour >= 11 && hour < 15) greeting = "Selamat Siang!";
            else if (hour >= 15 && hour < 18) greeting = "Selamat Sore!";
            else greeting = "Selamat Malam!";
            
            document.getElementById('welcomeText').textContent = greeting;

            // Set Kalimat Motivasi Acak
            const quotes = [
                "Disiplin adalah kunci utama kesuksesan.",
                "Keringat hari ini adalah hasil manis esok hari.",
                "Jangan berhenti ketika lelah, berhentilah ketika selesai.",
                "Latihan adalah investasi terbaik untuk tubuhmu.",
                "Percayalah pada proses, bukan hanya hasil.",
                "Tubuh yang kuat lahir dari pikiran yang kuat.",
                "Satu langkah kecil hari ini lebih baik dari seribu rencana besok.",
                "Rasa sakit hari ini adalah kekuatan esok hari.",
                "Kamu lebih kuat dari yang kamu kira.",
                "Konsistensi mengalahkan bakat.",
                "Fokus pada tujuan, bukan pada rintangan.",
                "Jadilah versi terbaik dari dirimu sendiri.",
                "Setiap tetes keringat tidak akan pernah sia-sia.",
                "Bangun kebiasaan baik, maka kesuksesan akan mengikutimu.",
                "Jangan takut mencoba, takutlah jika tidak pernah mencoba.",
                "Pikiran adalah senjata, latihlah dengan baik.",
                "Disiplin diri adalah bentuk cinta pada masa depan.",
                "Lelah itu wajar, menyerah itu pilihan.",
                "Setiap hari adalah kesempatan untuk menjadi lebih baik.",
                "Kekuatan sejati ada di dalam dirimu.",
                "Berikan usahamu yang terbaik hari ini.",
                "Jangan biarkan kemarin menghalangi harimu.",
                "Proses tidak akan mengkhianati hasil.",
                "Semangat hari ini, mari berlari menuju impian.",
                "Jadikan latihan sebagai kebutuhan, bukan beban.",
                "Tubuh yang sehat, jiwa yang kuat.",
                "Sedikit demi sedikit, lama-lama menjadi bukit.",
                "Fokuslah pada dirimu sendiri, bukan orang lain.",
                "Hasil tidak pernah bohong pada proses yang jujur.",
                "Tetap fokus, pantang menyerah, raih kemenangan."
            ];

            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('motivationText').textContent = randomQuote;

            // Pastikan state role konsisten saat pertama kali dimuat
            setRole(currentRole);
        });

        // Toggle Password Input Visibility
        document.getElementById('btnTogglePassword').addEventListener('click', () => {
            const passInput = document.getElementById('inputPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye text-base text-blue-600';
            } else {
                passInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye-slash text-base text-gray-400';
            }
        });

        // Toggle Selector Role
        function setRole(role) {
            currentRole = role;
            hideAlert();
            const highlight = document.getElementById('roleHighlight');
            const btnPelatih = document.getElementById('btnPelatih');
            const btnAnggota = document.getElementById('btnAnggota');

            if (role === 'Pelatih') {
                highlight.style.transform = 'translateX(0)';
                btnPelatih.classList.remove('text-gray-400', 'font-semibold');
                btnPelatih.classList.add('text-blue-600', 'font-bold');

                btnAnggota.classList.remove('text-blue-600', 'font-bold');
                btnAnggota.classList.add('text-gray-400', 'font-semibold');
            } else {
                highlight.style.transform = 'translateX(100%)';
                btnAnggota.classList.remove('text-gray-400', 'font-semibold');
                btnAnggota.classList.add('text-blue-600', 'font-bold');

                btnPelatih.classList.remove('text-blue-600', 'font-bold');
                btnPelatih.classList.add('text-gray-400', 'font-semibold');
            }
        }

        // Handle Form Submit
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            hideAlert();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('inputPassword').value.trim();

            showLoading(true, "Memverifikasi Akun...");

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'login',
                    username: username,
                    password: password,
                    role: currentRole
                })
            })
            .then(res => res.json())
            .then(data => {
                showLoading(false);
                if (data.success) {
                    // Simpan Sesi User di LocalStorage
                    localStorage.setItem('userSession', JSON.stringify(data.user));

                    // Redirection ke file terpisah
                    if (data.user.role === 'Pelatih') {
                        window.location.href = 'pelatih.html';
                    } else {
                        window.location.href = 'anggota.html';
                    }
                } else {
                    showAlert(data.message || "Username, Password, atau Role tidak sesuai!");
                }
            })
            .catch(err => {
                showLoading(false);
                console.error("GAS Connection Error:", err);
                showAlert("Terjadi kesalahan koneksi atau konfigurasi GAS belum benar!");
            });
        });

        function showLoading(show, text = "Memverifikasi...") {
            const overlay = document.getElementById('loadingOverlay');
            document.getElementById('loadingText').textContent = text;
            if (show) {
                overlay.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                overlay.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function showAlert(msg) {
            const alertBanner = document.getElementById('alertBanner');
            document.getElementById('alertMessage').textContent = msg;
            alertBanner.classList.remove('hidden');
        }

        function hideAlert() {
            document.getElementById('alertBanner').classList.add('hidden');
        }
    </script>
</body>
</html>
