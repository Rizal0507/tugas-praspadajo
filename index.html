<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASKIBRA SMPN 2 JOGOROTO | Web App</title>

    <!-- Favicon -->
    <link rel="icon" href="logo.png" type="image/png">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Custom Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    },
                    animation: {
                        float: 'float 4s ease-in-out infinite',
                    }
                }
            }
        }
    </script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .toast-enter { transform: translate(-50%, 0.5rem) !important; opacity: 1 !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex items-center justify-center sm:py-6">

    <div class="w-full max-w-md bg-white relative overflow-hidden min-h-screen sm:min-h-[750px] sm:rounded-[2.5rem] sm:shadow-2xl flex flex-col justify-between">
        
        <!-- Top Section: Header Biru Gradasi -->
        <div class="bg-gradient-to-b from-blue-700 via-blue-600 to-blue-500 pt-12 pb-24 px-6 flex flex-col items-center justify-start relative flex-none">
            <div class="absolute top-0 right-0 -mr-16 -mt-16 w-48 h-48 bg-white opacity-10 rounded-full blur-2xl"></div>
            <div class="absolute bottom-6 left-6 w-24 h-24 bg-blue-300 opacity-20 rounded-full blur-xl"></div>

            <div class="w-32 h-32 flex items-center justify-center z-10 mb-2 animate-float">
                <img src="./logo.png" id="appLogo" alt="Logo Paskibra SMPN 2 Jogoroto" class="max-h-full max-w-full object-contain drop-shadow-2xl" onerror="this.onerror=null; this.outerHTML='<i class=\'fa-solid fa-shield-halved text-white text-6xl drop-shadow-lg\'></i>';">
            </div>
            
            <div class="z-10 text-center px-2 mt-3">
                <p class="text-blue-100 text-xs font-semibold tracking-[0.45em] uppercase mb-2">WEB APP</p>
                <h2 class="text-white text-xl sm:text-2xl font-extrabold tracking-wide leading-tight">PASKIBRA SMPN 2 JOGOROTO</h2>
            </div>

            <!-- Running Text Ulang Tahun (Disembunyikan jika tidak ada yang ultah) -->
            <div id="marqueeBirthday" class="mt-4 hidden w-full overflow-hidden bg-yellow-400/20 border border-yellow-300/30 rounded-lg py-1.5 px-3 backdrop-blur-sm z-10">
                <marquee scrollamount="4" class="text-yellow-100 text-[10px] font-bold tracking-wide">
                    🎉 <span id="marqueeBirthdayText"></span> 🎉
                </marquee>
            </div>
        </div>

        <!-- Card Putih Form Login -->
        <div class="bg-white rounded-t-[2.5rem] flex-grow -mt-12 px-8 pt-8 pb-10 flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.08)] relative z-10">
            
            <h1 id="welcomeText" class="text-2xl font-bold text-gray-800 text-center mb-1">Memuat sapaan...</h1>
            <p id="motivationText" class="text-gray-400 text-xs text-center mb-6 font-medium">Menyiapkan motivasi...</p>

            <!-- Role Selector Toggle -->
            <div class="flex p-1 bg-gray-100 rounded-2xl mb-6 relative">
                <div id="roleHighlight" class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-white rounded-xl shadow-sm transition-all duration-300 ease-out" style="transform: translateX(100%);"></div>
                <button type="button" id="btnPelatih" class="flex-1 py-3 text-sm font-semibold text-gray-400 relative z-10 transition-colors duration-300" onclick="setRole('Pelatih')">Pelatih</button>
                <button type="button" id="btnAnggota" class="flex-1 py-3 text-sm font-bold text-blue-600 relative z-10 transition-colors duration-300" onclick="setRole('Anggota')">Anggota</button>
            </div>

            <!-- Alert Banner -->
            <div id="alertBanner" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 rounded-2xl text-rose-700 text-xs flex items-center gap-2.5">
                <i class="fa-solid fa-circle-exclamation text-rose-500 text-base flex-none"></i>
                <span id="alertMessage" class="font-medium"></span>
            </div>

            <!-- Form Login -->
            <form id="loginForm" class="flex flex-col gap-4">
                <div>
                    <label class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-1.5 block ml-1">Username</label>
                    <input type="text" id="username" required placeholder="Masukkan Username" class="w-full px-4 py-3.5 bg-gray-50 text-gray-800 text-sm rounded-2xl border border-gray-200 focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 transition-all placeholder:text-gray-400">
                </div>
                <div>
                    <label class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-1.5 block ml-1">Password</label>
                    <div class="relative">
                        <input type="password" id="inputPassword" required placeholder="Masukkan Password" class="w-full pl-4 pr-12 py-3.5 bg-gray-50 text-gray-800 text-sm rounded-2xl border border-gray-200 focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 transition-all placeholder:text-gray-400">
                        <button type="button" id="btnTogglePassword" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-500 p-1">
                            <i id="eyeIcon" class="fa-solid fa-eye-slash text-base"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="mt-4 w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/30 transform transition-all active:scale-95 hover:shadow-blue-500/50 flex items-center justify-center gap-2">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>
        </div>

        <!-- Loading Screen -->
        <div id="loadingOverlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[100] flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity">
            <div class="w-24 h-24 mb-4 flex items-center justify-center">
                <img src="./logo.png" alt="Loading" class="max-h-full max-w-full object-contain animate-pulse drop-shadow-xl" onerror="this.outerHTML='<i class=\'fa-solid fa-shield-halved text-blue-600 text-5xl animate-pulse\'></i>';">
            </div>
            <p id="loadingText" class="text-blue-700 font-bold text-sm animate-pulse">Memverifikasi Akun...</p>
        </div>

    </div>

    <!-- MODAL POPUP UCAPAN ULANG TAHUN -->
    <div id="birthdayModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[150] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 shadow-2xl w-full max-w-sm text-center flex flex-col items-center relative overflow-hidden">
            <div class="absolute -top-10 -right-10 text-9xl opacity-10">🎂</div>
            <img id="bdayFoto" src="" class="w-24 h-24 aspect-square rounded-full object-cover border-4 border-amber-400 shadow-lg mb-4 bg-gray-200">
            <h3 class="font-extrabold text-amber-500 text-2xl mb-1">Selamat Ulang Tahun!</h3>
            <p class="text-lg font-bold text-gray-800 mb-1" id="bdayNama">Nama</p>
            <p class="text-xs font-semibold text-gray-500 mb-4" id="bdayUmur">Ke-XX</p>
            <p class="text-xs text-gray-600 mb-6 leading-relaxed">"Semoga panjang umur, sehat selalu, dan dilancarkan segala urusannya. Teruslah berprestasi untuk Paskibra!"</p>
            <button id="btnBdayLanjut" class="w-full bg-amber-500 text-white font-bold py-3 rounded-xl active:scale-95 text-sm shadow-md">Masuk ke Dashboard</button>
        </div>
    </div>

    <!-- Script Logika Frontend & GAS API -->
    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwYTFRirtCpDT1vXJ0hSeFtElQR44rdoMPKskHgRPO3OlCr5_D_cXvLQOFzkDt4lY_IYw/exec';
        let currentRole = 'Anggota';

        // Fungsi bantuan untuk membaca link Google Drive
        function getDirectImageLink(url) {
            if(!url) return "";
            const match = url.match(/[-\w]{25,}/);
            return match ? `https://lh3.googleusercontent.com/d/${match[0]}` : url;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const hour = new Date().getHours();
            let greeting = "Selamat Malam!";
            if (hour >= 4 && hour < 11) greeting = "Selamat Pagi!";
            else if (hour >= 11 && hour < 15) greeting = "Selamat Siang!";
            else if (hour >= 15 && hour < 18) greeting = "Selamat Sore!";
            document.getElementById('welcomeText').textContent = greeting;

            const quotes = [
                "Disiplin adalah kunci utama kesuksesan.", "Keringat hari ini adalah hasil manis esok hari.",
                "Jangan berhenti ketika lelah, berhentilah ketika selesai.", "Latihan adalah investasi terbaik untuk tubuhmu.",
                "Percayalah pada proses, bukan hanya hasil.", "Tubuh yang kuat lahir dari pikiran yang kuat.",
                "Satu langkah kecil hari ini lebih baik dari seribu rencana besok.", "Rasa sakit hari ini adalah kekuatan esok hari.",
                "Kamu lebih kuat dari yang kamu kira.", "Konsistensi mengalahkan bakat."
            ];
            document.getElementById('motivationText').textContent = quotes[Math.floor(Math.random() * quotes.length)];

            setRole(currentRole);
            checkBirthdayMarquee();
        });

        // Cek Running Text Ulang Tahun
        function checkBirthdayMarquee() {
            fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getTodayBirthdays' }) })
            .then(r => r.json()).then(d => {
                if(d.success && d.data.length > 0) {
                    let names = d.data.map(b => b.namaPanggilan).join(', ');
                    document.getElementById('marqueeBirthdayText').textContent = `Hari ini ${names} berulang tahun!`;
                    document.getElementById('marqueeBirthday').classList.remove('hidden');
                }
            }).catch(e => console.log("Gagal load ultah:", e));
        }

        document.getElementById('btnTogglePassword').addEventListener('click', () => {
            const passInput = document.getElementById('inputPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye text-base text-blue-600';
            } else {
                passInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye-slash text-base text-gray-400';
            }
        });

        function setRole(role) {
            currentRole = role;
            hideAlert();
            const highlight = document.getElementById('roleHighlight');
            const btnPelatih = document.getElementById('btnPelatih');
            const btnAnggota = document.getElementById('btnAnggota');

            if (role === 'Pelatih') {
                highlight.style.transform = 'translateX(0)';
                btnPelatih.classList.remove('text-gray-400', 'font-semibold');
                btnPelatih.classList.add('text-blue-600', 'font-bold');
                btnAnggota.classList.remove('text-blue-600', 'font-bold');
                btnAnggota.classList.add('text-gray-400', 'font-semibold');
            } else {
                highlight.style.transform = 'translateX(100%)';
                btnAnggota.classList.remove('text-gray-400', 'font-semibold');
                btnAnggota.classList.add('text-blue-600', 'font-bold');
                btnPelatih.classList.remove('text-blue-600', 'font-bold');
                btnPelatih.classList.add('text-gray-400', 'font-semibold');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            hideAlert();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('inputPassword').value.trim();

            showLoading(true, "Memverifikasi Akun...");

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'login', username: username, password: password, role: currentRole })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('userSession', JSON.stringify(data.user));
                    
                    // CEK APAKAH USER YANG LOGIN SEDANG ULANG TAHUN
                    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getTodayBirthdays' }) })
                    .then(r => r.json()).then(dBday => {
                        const myBday = dBday.success ? dBday.data.find(b => b.username === data.user.username) : null;
                        
                        if (myBday) {
                            showLoading(false);
                            document.getElementById('bdayNama').textContent = myBday.nama;
                            document.getElementById('bdayUmur').textContent = `Yang ke-${myBday.umur}`;
                            document.getElementById('bdayFoto').src = myBday.fotoUrl ? getDirectImageLink(myBday.fotoUrl) : 'https://ui-avatars.com/api/?name=' + myBday.nama;
                            
                            // Tombol untuk lanjut ke dashboard
                            document.getElementById('btnBdayLanjut').onclick = () => {
                                window.location.href = data.user.role === 'Pelatih' ? 'pelatih.html' : 'anggota.html';
                            };
                            
                            document.getElementById('birthdayModal').classList.remove('hidden');
                            document.getElementById('birthdayModal').classList.add('flex');
                        } else {
                            // Jika tidak ultah, langsung redirect
                            showLoading(false);
                            if (data.user.role === 'Pelatih') window.location.href = 'pelatih.html';
                            else window.location.href = 'anggota.html';
                        }
                    }).catch(e => {
                        // Jika gagal cek ultah, tetap redirect
                        showLoading(false);
                        if (data.user.role === 'Pelatih') window.location.href = 'pelatih.html';
                        else window.location.href = 'anggota.html';
                    });
                } else {
                    showLoading(false);
                    showAlert(data.message || "Username, Password, atau Role tidak sesuai!");
                }
            })
            .catch(err => {
                showLoading(false);
                showAlert("Terjadi kesalahan koneksi atau konfigurasi GAS belum benar!");
            });
        });

        function showLoading(show, text = "Memverifikasi...") {
            const overlay = document.getElementById('loadingOverlay');
            document.getElementById('loadingText').textContent = text;
            if (show) overlay.classList.remove('opacity-0', 'pointer-events-none');
            else overlay.classList.add('opacity-0', 'pointer-events-none');
        }

        function showAlert(msg) {
            document.getElementById('alertMessage').textContent = msg;
            document.getElementById('alertBanner').classList.remove('hidden');
        }

        function hideAlert() {
            document.getElementById('alertBanner').classList.add('hidden');
        }
    </script>
</body>
</html>
